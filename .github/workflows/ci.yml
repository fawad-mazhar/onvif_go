name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Go test + c14n spike
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -count=1

      - name: c14n spike (smoke)
        # Validates that ucarion/c14n still parses + canonicalizes every
        # captured fixture.
        run: go run ./test/scripts/c14n_spike

      - name: Golden diff (regression gate)
        # Enforces test/fixtures/.baseline: every op that previously
        # passed the golden diff must still pass. New passes are allowed.
        run: bash test/scripts/golden_diff.sh
